  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="02-meet-dara"]');
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-meet-dara"] = tl;

      const q = (selector) => root.querySelector(selector);
      const qa = (selector) => Array.from(root.querySelectorAll(selector));
      const byId = (value) => document.getElementById(value);
      const frame = 1 / 60;

      const titleCascade = [
        { target: byId("02-meet-dara-letter-d"), start: 0.04, y: 80, duration: 0.19 },
        { target: byId("02-meet-dara-letter-a1"), start: 0.04 + 0.19 + frame, y: 50, duration: 0.15 },
        { target: byId("02-meet-dara-letter-r"), start: 0.04 + 0.19 + frame + 0.15 - frame, y: 45, duration: 0.14 },
        { target: byId("02-meet-dara-letter-a2"), start: 0.04 + 0.19 + 0.15 + 0.14 - frame, y: 70, duration: 0.15 },
      ];

      titleCascade.forEach((item) => {
        tl.set(item.target, { opacity: 1, y: item.y }, item.start);
        tl.to(
          item.target,
          { y: 0, duration: item.duration, ease: "power4.out" },
          item.start,
        );
      });

      tl.fromTo(
        byId("02-meet-dara-surface"),
        { opacity: 0.14, y: 142 },
        { opacity: 1, y: 0, duration: 1.58, ease: "power4.out" },
        0.38,
      );

      tl.fromTo(
        byId("02-meet-dara-morph-card"),
        {
          scale: 3.2,
          borderRadius: 0,
          backgroundColor: "#14181c",
        },
        {
          scale: 1,
          borderRadius: 0,
          backgroundColor: "#181a19",
          duration: 1.12,
          ease: "power2.inOut",
        },
        1.28,
      );
      tl.to(
        byId("02-meet-dara-content-old"),
        { opacity: 0, duration: 0.44, ease: "power1.in" },
        1.28,
      );
      tl.to(
        byId("02-meet-dara-content-new"),
        { opacity: 1, duration: 0.44, ease: "power1.out" },
        1.96,
      );

      tl.fromTo(
        byId("02-meet-dara-phrase"),
        { opacity: 0, x: -32 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" },
        2.64,
      );
      tl.fromTo(
        byId("02-meet-dara-input-highlight"),
        { opacity: 0 },
        { opacity: 1, duration: 0.54, ease: "power1.out" },
        2.9,
      );

      const controlPaths = [
        { el: byId("02-meet-dara-boundary-main"), start: 3.46, duration: 0.72 },
        { el: byId("02-meet-dara-boundary-top"), start: 4.0, duration: 0.48 },
        { el: byId("02-meet-dara-boundary-provider"), start: 4.36, duration: 0.68 },
      ];
      controlPaths.forEach((item) => {
        const length = item.el.getTotalLength();
        item.el.style.strokeDasharray = `${length}`;
        item.el.style.strokeDashoffset = `${length}`;
        tl.to(
          item.el,
          { strokeDashoffset: 0, duration: item.duration, ease: "power2.out" },
          item.start,
        );
      });

      const wordTimings = {
        brief: { start: 0.22, end: 1.04 },
        provider: { start: 1.38, end: 2.68 },
      };
      const glowDriver = { t: 0 };
      const glowWords = qa(".frame-02-meet-dara-word");
      const attack = 0.18;
      const release = 0.42;
      const restLevel = 0.08;
      const glowDuration = 3.02;

      const envelope = (time, start, end) => {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attack, 1);
        const releaseEnd = end + release;
        if (time < releaseEnd) {
          return 1 - ((time - end) / release) * (1 - restLevel);
        }
        return restLevel;
      };

      const lerp = (a, b, amount) => Math.round(a + (b - a) * amount);
      tl.to(
        glowDriver,
        {
          t: glowDuration,
          duration: glowDuration,
          ease: "none",
          onUpdate: () => {
            glowWords.forEach((word) => {
              const timing = wordTimings[word.dataset.word];
              if (!timing) return;
              const amount = envelope(glowDriver.t, timing.start, timing.end);
              const active = { r: 255, g: 255, b: 255 };
              const rest = { r: 72, g: 80, b: 77 };
              word.style.color = `rgb(${lerp(rest.r, active.r, amount)}, ${lerp(rest.g, active.g, amount)}, ${lerp(rest.b, active.b, amount)})`;
              word.style.textShadow = `0 0 ${38 * amount}px rgba(46, 125, 91, ${0.76 * amount})`;
              word.style.transform = `scale(${1 + 0.18 * amount})`;
            });
          },
        },
        2.64,
      );

      const content = [
        { key: "govern", body: "policy", hold: 0.1 },
        { key: "preserve", body: "record", hold: 0.1 },
        { key: "verify", body: "bytes", hold: 0.14 },
      ];
      const baseDuration = 0.78;
      const secondsPerCharacter = 0.035;
      let cumulative = 0;
      const sequence = content.map((entry) => {
        const duration = baseDuration + entry.key.length * secondsPerCharacter + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      const sequenceStart = 5.78;

      sequence.forEach((entry) => {
        const row = byId(`02-meet-dara-label-${entry.key}`);
        const line = byId(`02-meet-dara-line-${entry.key}`);
        const dot = byId(`02-meet-dara-dot-${entry.key}`);
        const lineLength = line.getTotalLength();
        line.style.strokeDasharray = `${lineLength}`;
        line.style.strokeDashoffset = `${lineLength}`;

        tl.fromTo(
          row,
          { opacity: 0, y: 42 },
          { opacity: 1, y: 0, duration: 0.52, ease: "power4.out" },
          sequenceStart + entry.start,
        );
        tl.to(
          line,
          { strokeDashoffset: 0, duration: 0.56, ease: "power2.out" },
          sequenceStart + entry.start + 0.22,
        );
        tl.fromTo(
          dot,
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" },
          sequenceStart + entry.start + 0.66,
        );
      });

      tl.fromTo(
        byId("02-meet-dara-rail"),
        { borderTopColor: "#262827", borderBottomColor: "#262827" },
        {
          borderTopColor: "#2e7d5b",
          borderBottomColor: "#2e7d5b",
          duration: 0.48,
          ease: "power1.out",
        },
        9.16,
      );
    })();
  </script>
