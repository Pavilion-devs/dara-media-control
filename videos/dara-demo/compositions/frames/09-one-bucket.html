  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="09-one-bucket"]');
      const tl = gsap.timeline({ paused: true });

      const title = root.querySelector('[class~="09-one-bucket-title"]');
      const headerRule = root.querySelector('[class~="09-one-bucket-rule"]');
      const core = root.querySelector('[class~="09-one-bucket-core"]');
      const coreLabel = root.querySelector('[class~="09-one-bucket-core-label"]');
      const tokenWrap = root.querySelector('[class~="09-one-bucket-token-wrap"]');
      const tokenEl = root.querySelector('[id="09-one-bucket-token"]');
      const tokenMark = root.querySelector('[class~="09-one-bucket-token-mark"]');

      const bucketPaths = Array.from(root.querySelectorAll('[class~="09-one-bucket-core-path"]'));
      const connectorPaths = Array.from(root.querySelectorAll('[class~="09-one-bucket-connector"]'));

      [...bucketPaths, ...connectorPaths].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      tl.fromTo(
        title,
        { opacity: 0, y: 14, scale: 0.965 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" },
        0.08,
      );
      tl.fromTo(
        headerRule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.62, ease: "power2.out" },
        0.16,
      );
      tl.fromTo(
        core,
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power1.out" },
        0.24,
      );

      bucketPaths.forEach((path, index) => {
        tl.to(
          path,
          {
            strokeDashoffset: 0,
            duration: index === bucketPaths.length - 1 ? 0.58 : 0.76,
            ease: "power2.out",
          },
          0.34 + index * 0.56,
        );
      });

      tl.fromTo(
        coreLabel,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" },
        1.92,
      );

      const makeSequence = (entries, start, baseDuration, secondsPerChar, hold) => {
        let cursor = start;
        return entries.map((entry) => {
          const duration = baseDuration + entry.label.length * secondsPerChar + hold;
          const sequenced = { ...entry, start: cursor, end: cursor + duration };
          cursor += duration;
          return sequenced;
        });
      };

      const firstWave = makeSequence(
        [
          { selector: '[id="09-one-bucket-card-source"]', label: "source assets" },
          { selector: '[id="09-one-bucket-card-derivative"]', label: "exact published derivatives" },
          { selector: '[id="09-one-bucket-card-manifest"]', label: "manifests" },
        ],
        3.55,
        0.75,
        0.035,
        0.65,
      );

      const secondWave = makeSequence(
        [
          { selector: '[id="09-one-bucket-card-parquet"]', label: "immutable parquet partitions" },
          { selector: '[id="09-one-bucket-card-state"]', label: "recoverable app + job state" },
        ],
        9.68,
        0.7,
        0.03,
        0.58,
      );

      [...firstWave, ...secondWave].forEach((entry) => {
        tl.fromTo(
          root.querySelector(entry.selector),
          { scale: 0, opacity: 0, y: 18 },
          { scale: 1, opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
          entry.start,
        );
      });

      connectorPaths.forEach((path, index) => {
        tl.to(
          path,
          { strokeDashoffset: 0, duration: 0.68, ease: "power2.out" },
          9.92 + index * 0.62,
        );
      });

      tl.fromTo(
        tokenWrap,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        13.12,
      );
      tl.fromTo(
        tokenMark,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.48, ease: "power2.out" },
        14.18,
      );

      const TOKEN_STATES = [
        { t: 0, text: "OUTPUT DUMP", color: "#7c817f" },
        { t: 14.18, text: "PERSISTENCE LAYER", color: "#5aa681" },
      ];

      const tokenAt = (time) => {
        for (let index = TOKEN_STATES.length - 1; index >= 0; index -= 1) {
          if (time >= TOKEN_STATES[index].t) return TOKEN_STATES[index];
        }
        return TOKEN_STATES[0];
      };

      const tokenDriver = { t: 0 };
      let lastToken = "";
      tl.to(
        tokenDriver,
        {
          t: 17.45,
          duration: 17.45,
          ease: "none",
          onUpdate: () => {
            const state = tokenAt(tokenDriver.t);
            if (state.text !== lastToken) {
              tokenEl.textContent = state.text;
              tokenEl.style.color = state.color;
              lastToken = state.text;
            }
          },
        },
        0,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["09-one-bucket"] = tl;
    })();
  </script>
