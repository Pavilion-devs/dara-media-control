  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      const livePath = document.getElementById("frame-11-live-receipt-live-path");
      const pathLength = livePath.getTotalLength();
      livePath.style.strokeDasharray = `${pathLength}`;
      livePath.style.strokeDashoffset = `${pathLength}`;

      const ledger = document.querySelector(".frame-11-live-receipt-ledger-window");
      const liveLockup = document.querySelector(".frame-11-live-receipt-live-lockup");
      const sourceTag = document.querySelector(".frame-11-live-receipt-source-tag");
      const assetsInstrument = document.getElementById("frame-11-live-receipt-instrument-assets");
      const runsInstrument = document.getElementById("frame-11-live-receipt-instrument-runs");
      const spendInstrument = document.getElementById("frame-11-live-receipt-instrument-spend");
      const assetsCounter = document.getElementById("frame-11-live-receipt-counter-assets");
      const runsCounter = document.getElementById("frame-11-live-receipt-counter-runs");
      const spendCounter = document.getElementById("frame-11-live-receipt-counter-spend");
      const metaRail = document.getElementById("frame-11-live-receipt-meta-rail");
      const scanLine = document.getElementById("frame-11-live-receipt-scan-line");

      const assetsState = { value: 0 };
      const runsState = { value: 0 };
      const spendState = { value: 0 };

      tl.fromTo(
        ledger,
        { y: 38, opacity: 0.18 },
        { y: 0, opacity: 1, duration: 0.82, ease: "power3.out" },
        0
      );
      tl.fromTo(
        ".frame-11-live-receipt-topline",
        { opacity: 0.2 },
        { opacity: 1, duration: 0.48, ease: "power1.out" },
        0.12
      );
      tl.fromTo(
        liveLockup,
        { opacity: 0.3 },
        { opacity: 1, duration: 0.35, ease: "power1.out" },
        0.28
      );
      tl.to(
        livePath,
        { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" },
        0.38
      );
      tl.fromTo(
        sourceTag,
        { x: -24, opacity: 0.2 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
        1.55
      );

      tl.fromTo(
        assetsInstrument,
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, ease: "power4.out" },
        2.8
      );
      tl.fromTo(
        "#frame-11-live-receipt-label-assets",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        3.0
      );
      tl.to(
        assetsState,
        {
          value: 6,
          duration: 1.55,
          ease: "power3.out",
          onUpdate: () => {
            assetsCounter.textContent = Math.round(assetsState.value).toLocaleString();
          }
        },
        3.15
      );
      tl.fromTo(
        assetsCounter,
        { scale: 0.52 },
        { scale: 1, duration: 1.55, ease: "power3.out" },
        3.15
      );

      tl.fromTo(
        runsInstrument,
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.42, ease: "power4.out" },
        4.25
      );
      tl.fromTo(
        "#frame-11-live-receipt-label-runs",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" },
        4.45
      );
      tl.to(
        runsState,
        {
          value: 9,
          duration: 1.55,
          ease: "power3.out",
          onUpdate: () => {
            runsCounter.textContent = Math.round(runsState.value).toLocaleString();
          }
        },
        4.58
      );
      tl.fromTo(
        runsCounter,
        { scale: 0.52 },
        { scale: 1, duration: 1.55, ease: "power3.out" },
        4.58
      );

      tl.fromTo(
        spendInstrument,
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.44, ease: "power4.out" },
        6.8
      );
      tl.fromTo(
        "#frame-11-live-receipt-label-spend",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.44, ease: "power2.out" },
        6.8
      );
      tl.to(
        spendState,
        {
          value: 95,
          duration: 1.82,
          ease: "power3.out",
          onUpdate: () => {
            const mills = Math.round(spendState.value).toString().padStart(3, "0");
            spendCounter.textContent = `$0.${mills}`;
          }
        },
        7.08
      );
      tl.fromTo(
        spendCounter,
        { scale: 0.52 },
        { scale: 1, duration: 1.82, ease: "power3.out" },
        7.08
      );

      tl.fromTo(
        metaRail,
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.38, ease: "power4.out" },
        9.2
      );
      tl.fromTo(
        scanLine,
        { x: 0, opacity: 0.9 },
        { x: 1706, opacity: 0.9, duration: 1.8, ease: "none" },
        9.2
      );

      const metaWords = document.querySelectorAll(".frame-11-live-receipt-meta-word");
      const keywordTimings = {
        model: { start: 0.08, end: 0.34 },
        status: { start: 0.46, end: 0.72 },
        hash: { start: 0.84, end: 1.10 },
        lineage: { start: 1.22, end: 1.64 }
      };
      const driver = { t: 0 };
      const attackDuration = 0.14;
      const releaseDuration = 0.24;
      const restLevel = 0.08;

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attackDuration, 1);
        const releaseEnd = end + releaseDuration;
        if (time < releaseEnd) {
          return 1 - ((time - end) / releaseDuration) * (1 - restLevel);
        }
        return restLevel;
      }

      function lerpChannel(a, b, amount) {
        return Math.round(a + (b - a) * amount);
      }

      tl.to(
        driver,
        {
          t: 1.8,
          duration: 1.8,
          ease: "none",
          onUpdate: () => {
            metaWords.forEach((word) => {
              const timing = keywordTimings[word.dataset.word];
              if (!timing) return;
              const env = envelope(driver.t, timing.start, timing.end);
              const red = lerpChannel(124, 90, env);
              const green = lerpChannel(129, 166, env);
              const blue = lerpChannel(127, 129, env);
              word.style.color = `rgb(${red}, ${green}, ${blue})`;
              word.style.textShadow = `0 0 ${34 * env}px rgba(90, 166, 129, ${0.72 * env})`;
              word.style.transform = `scale(${1 + 0.18 * env})`;
            });
          }
        },
        9.2
      );

      tl.to({}, { duration: 2.296 }, 11.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["11-live-receipt"] = tl;
    })();
  </script>
