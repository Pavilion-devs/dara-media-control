  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="07-one-byte-verdict"]');
      const q = (name) =>
        Array.from(root.querySelectorAll("[data-f07]")).find(
          (element) => element.dataset.f07 === name
        );
      const qa = (selector) => Array.from(root.querySelectorAll(selector));
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        q("title"),
        { y: -72, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.82, ease: "power3.out" },
        0
      );

      tl.fromTo(
        q("card-left"),
        { x: -420, rotateY: 26, scale: 0.85, opacity: 0 },
        { x: 0, rotateY: 13, scale: 1, opacity: 1, duration: 1.15, ease: "power3.out" },
        0.28
      );
      tl.fromTo(
        q("card-right"),
        { x: 420, rotateY: -26, scale: 0.85, opacity: 0 },
        { x: 0, rotateY: -13, scale: 1, opacity: 1, duration: 1.15, ease: "power3.out" },
        0.46
      );

      tl.to(q("card-left"), { y: -6, duration: 0.9, ease: "sine.inOut" }, 1.55);
      tl.to(q("card-right"), { y: 6, duration: 0.9, ease: "sine.inOut" }, 1.55);
      tl.to(q("card-left"), { y: 0, duration: 0.9, ease: "sine.inOut" }, 2.45);
      tl.to(q("card-right"), { y: 0, duration: 0.9, ease: "sine.inOut" }, 2.45);

      const hashStates = [
        { t: 0.0, left: "", right: "" },
        { t: 0.35, left: "efaf24d3", right: "efaf24d3" },
        { t: 0.82, left: "efaf24d3 c4cbeeb2", right: "efaf24d3 c4cbeeb2" },
        { t: 1.42, left: "efaf24d3 c4cbeeb2 497acd5f", right: "efaf24d3 c4cbeeb2 497acd5f" },
        { t: 2.05, left: "efaf24d3 c4cbeeb2 497acd5f cba1e485", right: "efaf24d3 c4cbeeb2 497acd5f cba1e485" },
        { t: 2.78, left: "efaf24d3 c4cbeeb2 497acd5f cba1e485", right: "efaf24d3 c4cbeeb2 497acd5f cba1e4F5" }
      ];

      const stateAt = (time) => {
        for (let i = hashStates.length - 1; i >= 0; i -= 1) {
          if (time >= hashStates[i].t) return hashStates[i];
        }
        return hashStates[0];
      };

      const hashDriver = { t: 0 };
      tl.to(
        hashDriver,
        {
          t: 4.4,
          duration: 4.4,
          ease: "none",
          onUpdate: () => {
            const state = stateAt(hashDriver.t);
            q("left-hash").textContent = state.left;
            const hasSuffix = hashDriver.t >= 2.05;
            q("right-prefix").textContent = hasSuffix ? state.right.slice(0, -2) : state.right;
            q("right-suffix").textContent = hasSuffix ? state.right.slice(-2) : "";
            q("right-suffix").style.color = hashDriver.t >= 2.78 ? "#c97a16" : "#2e7d5b";
          }
        },
        3.8
      );

      const cursorDriver = { p: 0 };
      tl.to(
        cursorDriver,
        {
          p: Math.PI * 12,
          duration: 4.4,
          ease: "none",
          onUpdate: () => {
            const opacity = Math.sin(cursorDriver.p) > 0 ? "1" : "0";
            q("left-cursor").style.opacity = opacity;
            q("right-cursor").style.opacity = opacity;
          }
        },
        3.8
      );

      const wordTimings = {
        stable: { start: 0.52, end: 1.02 },
        mutation: { start: 2.38, end: 3.28 }
      };
      const glowWords = qa('[class~="07-one-byte-verdict-glow-word"]');
      const glowDriver = { t: 0 };
      const attack = 0.18;
      const release = 0.46;
      const rest = 0.12;
      const envelope = (time, start, end) => {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attack, 1);
        if (time < end + release) return 1 - ((time - end) / release) * (1 - rest);
        return rest;
      };

      tl.to(
        glowDriver,
        {
          t: 4.4,
          duration: 4.4,
          ease: "none",
          onUpdate: () => {
            glowWords.forEach((el) => {
              const timing = wordTimings[el.dataset.word];
              const env = envelope(glowDriver.t, timing.start, timing.end);
              const isMutation = el.dataset.word === "mutation";
              const rgb = isMutation ? "201, 122, 22" : "46, 125, 91";
              el.style.textShadow = `0 0 ${34 * env}px rgba(${rgb}, ${0.72 * env})`;
              el.style.transform = `scale(${1 + 0.16 * env})`;
            });
          }
        },
        3.8
      );

      [
        ["provenance-left", 8.25],
        ["provenance-right", 8.44],
        ["verdict-left", 10.08],
        ["verdict-right", 10.34]
      ].forEach(([name, at]) => {
        tl.fromTo(
          q(name),
          { scale: 0, opacity: 0, y: 18 },
          { scale: 1, opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
          at
        );
      });

      tl.fromTo(
        q("boundary-primary"),
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        12.5
      );
      tl.fromTo(
        q("boundary-secondary"),
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        13.3
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["07-one-byte-verdict"] = tl;
    })();
  </script>
