  <script>
    (() => {
      const compositionRoot = document.querySelector('[data-composition-id="01-missing-receipt"]');
      const camera = compositionRoot.querySelector("#\\30 1-missing-receipt-camera");
      const counter = compositionRoot.querySelector("#\\30 1-missing-receipt-counter");
      const counterLabel = compositionRoot.querySelector("#\\30 1-missing-receipt-counter-label");
      const figure = compositionRoot.querySelector("#\\30 1-missing-receipt-figure");
      const rowFocus = compositionRoot.querySelector("#\\30 1-missing-receipt-row-focus");
      const rowIndex = compositionRoot.querySelector("#\\30 1-missing-receipt-row-index");
      const probeDeck = compositionRoot.querySelector("#\\30 1-missing-receipt-probe-deck");
      const verdict = compositionRoot.querySelector("#\\30 1-missing-receipt-verdict");
      const blurNode = compositionRoot.querySelector("#\\30 1-missing-receipt-camera-blur");
      const providers = Array.from(compositionRoot.querySelectorAll(".f01-missing-receipt-provider"));
      const probeWords = Array.from(compositionRoot.querySelectorAll(".f01-missing-receipt-probe-word"));

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["01-missing-receipt"] = tl;

      const countState = { value: 0 };
      const phase = { scale: 0.94, x: 0, y: 0 };
      const drift = { p: 0, amp: 1 };
      const blurProxy = { v: 0 };

      const applyCamera = () => {
        const dx = Math.sin(drift.p) * 4 * drift.amp;
        const dy = Math.sin(drift.p * 1.31) * 2.2 * drift.amp;
        camera.style.transform =
          `scale(${phase.scale}) translate(${phase.x + dx}px, ${phase.y + dy}px)`;
      };

      const writeBlur = () => {
        blurNode.setAttribute("stdDeviation", `${blurProxy.v} ${blurProxy.v}`);
      };

      applyCamera();
      writeBlur();

      tl.to(
        countState,
        {
          value: 4000,
          duration: 2.25,
          ease: "power3.out",
          onUpdate: () => {
            counter.textContent = Math.round(countState.value).toLocaleString("en-US");
          },
        },
        0.12
      );
      tl.fromTo(
        counter,
        { scale: 0.48, opacity: 0.72 },
        { scale: 1, opacity: 1, duration: 2.25, ease: "power3.out" },
        0.12
      );
      tl.fromTo(
        counterLabel,
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
        0.58
      );

      providers.forEach((provider, index) => {
        const fromX = index < 3 ? 54 : -54;
        tl.fromTo(
          provider,
          { x: fromX, y: 14, opacity: 0 },
          {
            x: 0,
            y: 0,
            opacity: 1,
            duration: 0.46,
            ease: "power4.out",
          },
          3.05 + index * 0.27
        );
      });

      tl.to(phase, { scale: 1, duration: 1.25, ease: "power2.out" }, 0.18);
      tl.to(
        phase,
        { scale: 1.5, y: 30, duration: 0.53, ease: "power3.in" },
        4.72
      );
      tl.to(
        blurProxy,
        { v: 18, duration: 0.53, ease: "power3.in", onUpdate: writeBlur },
        4.72
      );
      tl.set([figure, ...providers], { visibility: "hidden" }, 5.25);
      tl.set([rowFocus, rowIndex], { opacity: 1 }, 5.25);
      tl.to(
        phase,
        { scale: 1.22, y: 35, duration: 0.72, ease: "expo.out" },
        5.25
      );
      tl.to(
        blurProxy,
        { v: 0, duration: 0.72, ease: "expo.out", onUpdate: writeBlur },
        5.25
      );
      tl.to(
        phase,
        { scale: 1.27, y: 30, duration: 4.2, ease: "power2.inOut" },
        6.1
      );

      const PROBE_CONTENT = [
        { key: "cost", body: "total spend" },
        { key: "model", body: "recorded model" },
        { key: "file", body: "published asset" },
      ];
      const BASE_DURATION = 0.65;
      const SEC_PER_CHAR = 0.024;
      let probeCumulative = 0;
      const PROBE_TIMELINE = PROBE_CONTENT.map((entry) => {
        const duration = BASE_DURATION + entry.body.length * SEC_PER_CHAR;
        const start = probeCumulative;
        probeCumulative += duration;
        return { ...entry, start, end: probeCumulative };
      });

      PROBE_TIMELINE.forEach((entry) => {
        const probe = Array.from(compositionRoot.querySelectorAll("[data-probe]")).find(
          (element) => element.dataset.probe === entry.key
        );
        const line = document.getElementById(`01-missing-receipt-line-${entry.key}`);
        const dot = document.getElementById(`01-missing-receipt-dot-${entry.key}`);
        const at = 7.05 + entry.start;
        tl.fromTo(
          probe,
          { x: 38, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.48, ease: "power4.out" },
          at
        );
        tl.to(
          line,
          { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" },
          at + 0.08
        );
        tl.to(dot, { opacity: 1, duration: 0.18, ease: "none" }, at + 0.48);
      });

      const WORD_TIMINGS = {
        cost: { start: 0.08, end: 0.72 },
        model: { start: 1.12, end: 1.76 },
        file: { start: 2.18, end: 2.98 },
      };
      const wordDriver = { t: 0 };
      const ATTACK_DUR = 0.16;
      const RELEASE = 0.38;
      const REST_LEVEL = 0.12;
      const MAX_BLUR = 38;
      const MAX_SCALE_BOOST = 0.19;

      const envelope = (time, start, end) => {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        const releaseEnd = end + RELEASE;
        if (time < releaseEnd) {
          return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        }
        return REST_LEVEL;
      };

      tl.to(
        wordDriver,
        {
          t: 3.2,
          duration: 3.2,
          ease: "none",
          onUpdate: () => {
            probeWords.forEach((word) => {
              const timing = WORD_TIMINGS[word.dataset.word];
              if (!timing) return;
              const env = envelope(wordDriver.t, timing.start, timing.end);
              const r = Math.round(103 + (90 - 103) * env);
              const g = Math.round(110 + (166 - 110) * env);
              const b = Math.round(107 + (129 - 107) * env);
              word.style.color = `rgb(${r}, ${g}, ${b})`;
              word.style.textShadow =
                `0 0 ${MAX_BLUR * env}px rgba(90, 166, 129, ${0.72 * env})`;
              word.style.transform = `scale(${1 + MAX_SCALE_BOOST * env})`;
            });
          },
        },
        7.05
      );

      tl.to(
        probeDeck,
        {
          scale: 0.8,
          filter: "blur(10px)",
          opacity: 1,
          duration: 0.2,
          ease: "power3.in",
        },
        10.5
      );
      tl.set(probeDeck, { opacity: 0 }, 10.7);
      tl.fromTo(
        verdict,
        { scale: 1.25, filter: "blur(10px)", opacity: 1 },
        {
          scale: 1,
          filter: "blur(0px)",
          opacity: 1,
          duration: 0.5,
          ease: "expo.out",
        },
        10.7
      );
      tl.to(drift, { amp: 0, duration: 0.4, ease: "power2.out" }, 10.5);

      tl.to(
        drift,
        {
          p: Math.PI * 2 * 1.7,
          duration: 14.237,
          ease: "none",
          onUpdate: applyCamera,
        },
        0
      );
    })();
  </script>
