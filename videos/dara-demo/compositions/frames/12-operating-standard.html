        <p class="12-operating-standard-statement">
          <span class="12-operating-standard-verb">govern</span><span class="12-operating-standard-rest"> before spend.</span>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="12-operating-standard"]');
      const tl = gsap.timeline({ paused: true });

      const statement = root.querySelector('[class~="12-operating-standard-statement"]');
      const verb = root.querySelector('[class~="12-operating-standard-verb"]');
      const rest = root.querySelector('[class~="12-operating-standard-rest"]');
      const endcard = root.querySelector('[class~="12-operating-standard-endcard"]');
      const letters = Array.from(root.querySelectorAll('[class~="12-operating-standard-letter"]'));
      const urlWrap = root.querySelector('[class~="12-operating-standard-url-wrap"]');

      const STATES = [
        { t: 0, verb: "govern", rest: " before spend.", accent: false, endcard: false },
        { t: 1.2, verb: "preserve", rest: " every attempt.", accent: false, endcard: false },
        { t: 2.5, verb: "verify", rest: " what shipped.", accent: true, endcard: false },
        { t: 3.8, verb: "", rest: "", accent: false, endcard: true },
      ];

      const stateAt = (time) => {
        for (let index = STATES.length - 1; index >= 0; index -= 1) {
          if (time >= STATES[index].t) return STATES[index];
        }
        return STATES[0];
      };

      gsap.set(endcard, { opacity: 0 });
      gsap.set(letters, { opacity: 0 });
      gsap.set(urlWrap, { opacity: 0 });

      const driver = { t: 0 };
      let renderedState = "";

      tl.to(
        driver,
        {
          t: 6.087,
          duration: 6.087,
          ease: "none",
          onUpdate: () => {
            const state = stateAt(driver.t);
            const stateKey = `${state.t}`;

            if (stateKey !== renderedState) {
              verb.textContent = state.verb;
              rest.textContent = state.rest;
              verb.dataset.accent = state.accent ? "true" : "false";
              statement.style.visibility = state.endcard ? "hidden" : "visible";
              renderedState = stateKey;
            }
          },
        },
        0,
      );

      tl.set(endcard, { opacity: 1 }, 3.8);

      letters.forEach((letter, index) => {
        const offsets = [
          { x: -52, y: 0 },
          { x: -18, y: -34 },
          { x: 18, y: 34 },
          { x: 52, y: 0 },
        ];

        tl.fromTo(
          letter,
          {
            opacity: 0,
            x: offsets[index].x,
            y: offsets[index].y,
            scale: 0.82,
          },
          {
            opacity: 1,
            x: 0,
            y: 0,
            scale: 1,
            duration: 0.42,
            ease: "power4.out",
          },
          3.8 + index * 0.07,
        );
      });

      tl.fromTo(
        urlWrap,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        4.2,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["12-operating-standard"] = tl;
    })();
  </script>
