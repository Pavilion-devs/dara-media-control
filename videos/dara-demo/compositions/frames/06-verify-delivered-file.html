    .f06-proof-stub {

  </style>

  <div
    id="root"
    data-composition-id="06-verify-delivered-file"
    data-width="1920"
    data-height="1080"
    data-duration="15.185"
  >
    <div
      class="clip f06-ground"
      data-start="0"
      data-duration="15.185"
      data-track-index="0"
    ></div>

    <div
      class="clip f06-stage"
      data-start="0"
      data-duration="15.185"
      data-track-index="1"
    >
      <div class="f06-world">
        <div class="f06-product">
          <img
            src="assets/dara-verify.jpg"
            alt="Dara Verify production screen showing a trusted published record match"
          />
          <div class="f06-product-rule"></div>
        </div>

        <div class="f06-hash-target">
          <div class="f06-hash-meta">
            <span>whole file / sha-256</span>
            <span class="f06-hash-state">hashing exact bytes</span>
          </div>
          <div class="f06-hash-line">
            <span class="f06-hash-text">efaf24d3</span><span class="f06-hash-cursor">_</span>
          </div>
          <svg
            class="f06-compare-svg"
            viewBox="0 0 772 16"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path class="f06-compare-path" d="M 0 8 L 772 8" />
          </svg>
        </div>

        <aside class="f06-proof">
          <div class="f06-scan-mark"></div>
          <div class="f06-proof-kicker">
            <span>verify / published object</span>
            <span>b2 trusted record</span>
          </div>

          <div class="f06-proof-display">
            <span class="f06-proof-word" data-word="match">match</span>
          </div>

          <div class="f06-proof-row" data-sequence-key="match">
            <div class="f06-proof-label">result</div>
            <div class="f06-proof-value">
              published_sha256 = exact
              <span class="f06-proof-note">stored record and delivered bytes agree</span>
            </div>
          </div>

          <div class="f06-proof-row" data-sequence-key="object">
            <div class="f06-proof-label">
              <span class="f06-proof-word" data-word="object">object</span>
            </div>
            <div class="f06-proof-value">
              dara-verified-published.png
              <span class="f06-proof-note">trusted object / b2</span>
            </div>
          </div>

          <div class="f06-proof-row" data-sequence-key="lineage">
            <div class="f06-proof-label">
              <span class="f06-proof-word" data-word="lineage">lineage</span>
            </div>
            <div class="f06-proof-value">
              generated → embedded → published
              <span class="f06-proof-note">receipt complete</span>
            </div>
          </div>

          <div class="f06-proof-footer">
            <span class="f06-proof-stub"></span>
            <span>exact object / complete receipt</span>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "06-verify-delivered-file";
      const scope = document.querySelector('[data-composition-id="06-verify-delivered-file"]');
      const world = scope.querySelector(".f06-world");
      const hashTarget = scope.querySelector(".f06-hash-target");
      const hashText = scope.querySelector(".f06-hash-text");
      const hashCursor = scope.querySelector(".f06-hash-cursor");
      const hashState = scope.querySelector(".f06-hash-state");
      const comparePath = scope.querySelector(".f06-compare-path");
      const proofWords = Array.from(scope.querySelectorAll(".f06-proof-word"));
      const proofRows = Array.from(scope.querySelectorAll(".f06-proof-row"));

      const rootRect = scope.getBoundingClientRect();
      const targetRect = hashTarget.getBoundingClientRect();
      const offsetX =
        targetRect.left - rootRect.left + targetRect.width / 2 - rootRect.width / 2;
      const offsetY =
        targetRect.top - rootRect.top + targetRect.height / 2 - rootRect.height / 2;

      const openingScale = 2.55;
      const cam = {
        scale: openingScale,
        x: -offsetX * openingScale,
        y: -offsetY * openingScale,
      };

      function applyCamera() {
        world.style.transform =
          `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }

      applyCamera();

      const sequence = [
        { t: 0.0, text: "efaf24d3" },
        { t: 0.55, text: "efaf24d3 c4cbeeb2" },
        { t: 1.05, text: "efaf24d3 c4cbeeb2 497acd5f" },
        { t: 1.55, text: "efaf24d3 c4cbeeb2 497acd5f cba1e485" },
        { t: 2.1, text: "efaf24d3 c4cbeeb2 497acd5f cba1e485 be529a0e" },
        { t: 2.7, text: "efaf24d3 c4cbeeb2 497acd5f cba1e485 be529a0e ce944190" },
        {
          t: 3.35,
          text: "efaf24d3 c4cbeeb2 497acd5f cba1e485 be529a0e ce944190 c4caef…",
        },
        {
          t: 3.82,
          text: "efaf24d3 c4cbeeb2 497acd5f cba1e485 be529a0e ce944190 c4caef…",
        },
      ];

      function hashAt(time) {
        for (let i = sequence.length - 1; i >= 0; i -= 1) {
          if (time >= sequence[i].t) return sequence[i].text;
        }
        return sequence[0].text;
      }

      const compareLength = comparePath.getTotalLength();
      comparePath.style.strokeDasharray = `${compareLength}`;
      comparePath.style.strokeDashoffset = `${compareLength}`;

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;

      const typeDriver = { t: 0 };
      const blinkDriver = { p: 0 };

      tl.to(
        typeDriver,
        {
          t: 4,
          duration: 4,
          ease: "none",
          onUpdate: () => {
            hashText.textContent = hashAt(typeDriver.t);
            hashState.textContent =
              typeDriver.t >= 3.82 ? "whole-file digest ready" : "hashing exact bytes";
          },
        },
        0,
      );

      tl.to(
        blinkDriver,
        {
          p: Math.PI * 2 * 7,
          duration: 4,
          ease: "none",
          onUpdate: () => {
            hashCursor.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
          },
        },
        0,
      );

      tl.to(
        comparePath,
        {
          strokeDashoffset: 0,
          duration: 2.65,
          ease: "power2.out",
        },
        4.2,
      );

      tl.fromTo(
        hashState,
        { color: "#7c817f" },
        {
          color: "#5aa681",
          duration: 0.55,
          ease: "power1.out",
        },
        6.55,
      );

      tl.to(
        cam,
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: 2.5,
          ease: "expo.out",
          onUpdate: applyCamera,
        },
        7.5,
      );

      const content = [
        { key: "match", body: "published_sha256 exact", hold: 0.72 },
        { key: "object", body: "trusted object b2", hold: 0.58 },
        { key: "lineage", body: "generated embedded published", hold: 1.1 },
      ];
      const baseDuration = 0.58;
      const secondsPerCharacter = 0.022;
      let rawTotal = 0;
      const rawTimeline = content.map((entry) => {
        const duration = baseDuration + entry.body.length * secondsPerCharacter + entry.hold;
        const start = rawTotal;
        rawTotal += duration;
        return { ...entry, start, end: rawTotal };
      });
      const sceneFourDuration = 4.15;
      const scaleToScene = sceneFourDuration / rawTotal;
      const contentTimeline = rawTimeline.map((entry) => ({
        ...entry,
        start: entry.start * scaleToScene,
        end: entry.end * scaleToScene,
      }));

      function contentAt(time) {
        for (let i = contentTimeline.length - 1; i >= 0; i -= 1) {
          if (time >= contentTimeline[i].start) return contentTimeline[i];
        }
        return contentTimeline[0];
      }

      const wordTimings = {
        match: { start: 0.2, end: 0.95 },
        object: { start: 1.55, end: 2.15 },
        lineage: { start: 2.95, end: 3.75 },
      };

      function envelope(time, start, end) {
        const attackDuration = 0.16;
        const releaseDuration = 0.42;
        const restLevel = 0.12;
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attackDuration, 1);
        const releaseEnd = end + releaseDuration;
        if (time < releaseEnd) {
          return 1 - ((time - end) / releaseDuration) * (1 - restLevel);
        }
        return restLevel;
      }

      const proofDriver = { t: 0 };
      let lastSequenceKey = "";

      tl.to(
        proofDriver,
        {
          t: sceneFourDuration,
          duration: sceneFourDuration,
          ease: "none",
          onUpdate: () => {
            const active = contentAt(proofDriver.t);
            if (active.key !== lastSequenceKey) {
              const activeIndex = contentTimeline.findIndex((entry) => entry.key === active.key);
              proofRows.forEach((row, index) => {
                const landed = index <= activeIndex;
                row.style.opacity = landed ? "1" : "0.34";
                row.style.borderTopColor = index === activeIndex ? "#5aa681" : "#262827";
              });
              lastSequenceKey = active.key;
            }

            proofWords.forEach((word) => {
              const timing = wordTimings[word.dataset.word];
              if (!timing) return;
              const env = envelope(proofDriver.t, timing.start, timing.end);
              word.style.textShadow =
                `0 0 ${38 * env}px rgba(46, 125, 91, ${0.78 * env})`;
              word.style.transform = `scale(${1 + 0.18 * env})`;
            });
          },
        },
        10,
      );
    })();
  </script>
</template>
