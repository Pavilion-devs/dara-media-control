          duration: 2.0,
          ease: "power3.inOut",
          onUpdate: applyCamera
        },
        8.5
      );
      tl.fromTo(
        byId("query-path-live"),
        { strokeDashoffset: 2600 },
        { strokeDashoffset: 0, duration: 3.5, ease: "power2.inOut" },
        6.7
      );

      const sequence = [
        { t: 0.0, text: "" },
        { t: 0.18, text: "SEL" },
        { t: 0.36, text: "SELECT spend," },
        { t: 0.72, text: "SELECT spend, provenence" },
        { t: 1.12, text: "SELECT spend, proven" },
        { t: 1.56, text: "SELECT spend, provenance FROM" },
        { t: 2.12, text: "SELECT spend, provenance FROM read_parquet('b2://dara/*')" },
        { t: 2.72, text: "SELECT spend, provenance FROM read_parquet('b2://dara/*') ✓" }
      ];
      const textAt = (time) => {
        for (let i = sequence.length - 1; i >= 0; i -= 1) {
          if (time >= sequence[i].t) return sequence[i].text;
        }
        return "";
      };
      const textDriver = { t: 0 };
      const queryText = byId("query-text");
      tl.to(
        textDriver,
        {
          t: 4,
          duration: 4,
          ease: "none",
          onUpdate: () => {
            queryText.textContent = textAt(textDriver.t);
            queryText.style.color = textDriver.t >= 2.72 ? "#2E7D5B" : "#FFFFFF";
          }
        },
        6.5
      );

      const blink = { p: 0 };
      const cursor = byId("query-cursor");
      tl.to(
        blink,
        {
          p: Math.PI * 12,
          duration: 4,
          ease: "none",
          onUpdate: () => {
            cursor.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          }
        },
        6.5
      );

      tl.fromTo(
        byId("result-rows"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.36, ease: "power2.out" },
        8.22
      );
      [1, 2, 3, 4, 5].forEach((row, index) => {
        tl.fromTo(
          byId(`result-row-${row}`),
          { opacity: 0, x: -90 },
          { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
          8.35 + index * 0.34
        );
      });

      tl.fromTo(
        byId("ledger-wrap"),
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" },
        9.58
      );
      tl.fromTo(
        byId("ledger-label"),
        { opacity: 0, y: -18 },
        { opacity: 1, y: 0, duration: 0.48, ease: "power2.out" },
        10.08
      );
      tl.to(
        drift,
        {
          strength: 0,
          duration: 0.6,
          ease: "power2.out",
          onUpdate: applyCamera
        },
        9.9
      );

      tl.fromTo(
        byId("lockup-rule"),
        { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" },
        { opacity: 1, scaleX: 1, duration: 0.42, ease: "power3.out" },
        10.72
      );
      tl.fromTo(
        byId("lockup-one"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
        11.1
      );
      tl.fromTo(
        byId("lockup-two"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
        12.02
      );
    })();
  </script>
</template>
