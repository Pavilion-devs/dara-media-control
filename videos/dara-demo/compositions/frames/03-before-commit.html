  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      const q = (id) => document.querySelector('[id="' + id + '"]');
      const tl = gsap.timeline({ paused: true });

      const morphCard = q("03-before-commit-morph-card");
      const contentOld = q("03-before-commit-content-old");
      const contentNew = q("03-before-commit-content-new");
      const studioCrop = q("03-before-commit-studio-crop");
      const receipts = q("03-before-commit-receipts");
      const briefMask = q("03-before-commit-brief-grow-mask");
      const briefSheet = q("03-before-commit-brief-grow-sheet");
      const below = q("03-before-commit-below");
      const typedText = q("03-before-commit-typed-text");
      const cursor = q("03-before-commit-cursor");
      const decisionLabel = q("03-before-commit-decision-label");
      const submit = q("03-before-commit-submit");
      const estimateValue = q("03-before-commit-estimate-value");
      const estimateWrap = q("03-before-commit-estimate-wrap");
      const progressFill = q("03-before-commit-progress-fill");

      tl.fromTo(
        morphCard,
        {
          scale: 0.62,
          x: 116,
          y: 64,
          opacity: 0.2,
          borderRadius: 0,
          backgroundColor: "#14181c"
        },
        {
          scale: 1,
          x: 0,
          y: 0,
          opacity: 1,
          borderRadius: 0,
          backgroundColor: "#181a19",
          duration: 2.05,
          ease: "power2.inOut"
        },
        0.12
      );

      tl.fromTo(
        studioCrop,
        { x: 96, opacity: 0.12 },
        { x: 0, opacity: 1, duration: 1.2, ease: "power3.out" },
        0.28
      );

      tl.to(
        contentOld,
        { opacity: 0, duration: 0.68, ease: "power1.in" },
        1.06
      );

      tl.fromTo(
        contentNew,
        { opacity: 0 },
        { opacity: 1, duration: 0.76, ease: "power1.out" },
        1.48
      );

      const BODY_H = 226;
      const COLLAPSED_H = 110;
      const grow = { h: COLLAPSED_H };

      function renderGrow() {
        const scale = Math.max(grow.h / BODY_H, 0.0001);
        gsap.set(briefMask, { scaleY: scale, transformOrigin: "50% 0%" });
        gsap.set(briefSheet, { scaleY: 1 / scale, transformOrigin: "50% 0%" });
        gsap.set(below, { y: grow.h - BODY_H });
      }

      renderGrow();

      tl.to(
        grow,
        { h: 168, duration: 0.18, ease: "power3.out", onUpdate: renderGrow },
        4.54
      );

      tl.to(
        grow,
        { h: BODY_H, duration: 0.18, ease: "power3.out", onUpdate: renderGrow },
        5.18
      );

      const TYPE_SEQUENCE = [
        { t: 0.00, text: "" },
        { t: 0.18, text: "Hero" },
        { t: 0.42, text: "Hero shot of" },
        { t: 0.78, text: "Hero shot of a ceramic bowl" },
        { t: 1.18, text: "Hero shot of a ceramic bowl on washed linn" },
        { t: 1.42, text: "Hero shot of a ceramic bowl on washed lin" },
        { t: 1.68, text: "Hero shot of a ceramic bowl on washed linen," },
        { t: 2.08, text: "Hero shot of a ceramic bowl on washed linen,\nmorning light," },
        { t: 2.64, text: "Hero shot of a ceramic bowl on washed linen,\nmorning light,\nquiet editorial" },
        { t: 3.18, text: "Hero shot of a ceramic bowl on washed linen,\nmorning light,\nquiet editorial composition" },
        { t: 3.68, text: "Hero shot of a ceramic bowl on washed linen,\nmorning light,\nquiet editorial composition ✓" }
      ];

      function textAt(time) {
        for (let i = TYPE_SEQUENCE.length - 1; i >= 0; i -= 1) {
          if (time >= TYPE_SEQUENCE[i].t) return TYPE_SEQUENCE[i].text;
        }
        return "";
      }

      const typeDriver = { t: 0 };
      tl.to(
        typeDriver,
        {
          t: 3.9,
          duration: 3.9,
          ease: "none",
          onUpdate: function () {
            typedText.textContent = textAt(typeDriver.t);
          }
        },
        2.52
      );

      const blinkDriver = { p: 0 };
      tl.to(
        blinkDriver,
        {
          p: Math.PI * 2 * 6,
          duration: 4.0,
          ease: "none",
          onUpdate: function () {
            cursor.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
          }
        },
        2.5
      );

      tl.fromTo(
        studioCrop,
        { x: 0, opacity: 1 },
        { x: -230, opacity: 0, duration: 0.32, ease: "power4.in", immediateRender: false },
        6.18
      );

      tl.fromTo(
        receipts,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.42, ease: "power4.out" },
        6.5
      );

      const RECEIPT_CONTENT = [
        { key: "pipeline", body: "Still campaign", hold: 0.34 },
        { key: "fallback", body: "Deterministic fixture", hold: 0.28 },
        { key: "policy", body: "Preflight allowed", hold: 0.42 }
      ];
      const BASE_DURATION = 0.56;
      const SEC_PER_CHAR = 0.012;
      let cumulative = 0;
      const RECEIPT_TIMELINE = RECEIPT_CONTENT.map(function (entry) {
        const duration = BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return {
          key: entry.key,
          body: entry.body,
          start: start,
          end: cumulative
        };
      });

      RECEIPT_TIMELINE.forEach(function (entry, index) {
        const row = receipts.querySelector('[data-receipt-index="' + index + '"]');
        tl.fromTo(
          row,
          { x: 42, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" },
          6.82 + entry.start
        );
      });

      tl.fromTo(
        progressFill,
        { scaleX: 0 },
        { scaleX: 1, duration: 3.72, ease: "none" },
        6.72
      );

      const estimateState = { value: 0 };
      const COUNT_AT = 9.08;
      const COUNT_DURATION = 1.55;

      tl.fromTo(
        estimateWrap,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" },
        COUNT_AT - 0.18
      );

      tl.to(
        estimateState,
        {
          value: 30,
          duration: COUNT_DURATION,
          ease: "power3.out",
          onUpdate: function () {
            estimateValue.textContent = "$0." + String(Math.round(estimateState.value)).padStart(3, "0");
          }
        },
        COUNT_AT
